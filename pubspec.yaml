name: universal_remote
description: Local-first universal remote for compatible Samsung Wi-Fi TVs.
publish_to: none
version: 0.2.0+2

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/launcher_foreground.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/launcher_full.png
  adaptive_icon_background: '#142C4D'
  adaptive_icon_foreground: assets/icons/launcher_foreground.png
  adaptive_icon_monochrome: assets/icons/launcher_monochrome.png
